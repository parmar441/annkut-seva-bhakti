[project]
name = "annkut-seva-bhakti-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
exclude = [".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
