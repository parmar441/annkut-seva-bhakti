<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B4410F}a:hover{color:#8A300A}
input::placeholder{color:#78716C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1C1917; display: flex; flex-direction: column; padding: 56px 24px 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 24px">
<div style="width: 72px; height: 72px; border-radius: 22px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13.5c0 3.4 3.8 5.5 8.5 5.5s8.5-2.1 8.5-5.5z"></path><path d="M12 3.5c1.6 2.1 2.2 3.5 2.2 4.8a2.2 2.2 0 0 1-4.4 0c0-1.3.6-2.7 2.2-4.8z"></path><path d="M9 21.5h6"></path></svg>
</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; text-align: center">Annkut Seva Bhakti</h1>
<p style="margin: 0; font-size: 15px; color: #57534E; text-align: center">Track your seva hours with ease</p>
</div>
<form style="margin-top: 40px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="u" style="font-size: 14px; font-weight: 600">Username</label>
<input id="u" type="text" autocomplete="username" placeholder="Enter your username" style="height: 52px; border: 1.5px solid #D6D0C6; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; background: #FFFFFF; color: #1C1917">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="p" style="font-size: 14px; font-weight: 600">Password</label>
<div style="position: relative">
<input id="p" type="password" autocomplete="current-password" placeholder="Enter your password" style="width: 100%; box-sizing: border-box; height: 52px; border: 1.5px solid #D6D0C6; border-radius: 14px; padding: 0 52px 0 16px; font: inherit; font-size: 16px; background: #FFFFFF; color: #1C1917">
<button type="button" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; color: #57534E; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>
<a href="Dashboard.dc.html" style="margin-top: 8px; height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign in</a>
<a href="AdminOverview.dc.html" style="align-self: center; font-size: 13px; color: #57534E; text-decoration: underline; padding: 12px">Preview admin console</a>
</form>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<p style="margin: 0; font-size: 15px; color: #57534E">First time doing seva with us?</p>
<a href="Register.dc.html" style="width: 100%; height: 52px; border-radius: 14px; border: 1.5px solid #D6D0C6; background: #FFFFFF; color: #1C1917; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Create volunteer account</a>
<p style="margin: 8px 0 0; font-size: 12px; color: #57534E; text-align: center">Admin accounts are set up by organizers only.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4410F","options":["#B4410F","#9F1239","#0F5E5A","#1E3A8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#B4410F' };
}
}
</script>
</body>
</html>
