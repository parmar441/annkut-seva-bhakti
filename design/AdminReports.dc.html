<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B4410F}a:hover{color:#8A300A}
input::placeholder{color:#78716C}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1C1917; display: flex; flex-direction: column">
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 16px; overflow: hidden">
<header style="display: flex; flex-direction: column; gap: 4px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 6px; background: #1C1917; color: #FFFFFF">ADMIN</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Reports</h1>
</header>

<section aria-label="Filters" style="background: #FFFFFF; border: 1px solid #E7E2DA; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div role="group" aria-label="Date preset" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{p.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="r1" style="font-size: 12px; font-weight: 600; color: #57534E">Start date</label><input id="r1" type="date" style="height: 44px; border: 1.5px solid #D6D0C6; border-radius: 12px; padding: 0 10px; font: inherit; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="r2" style="font-size: 12px; font-weight: 600; color: #57534E">End date</label><input id="r2" type="date" style="height: 44px; border: 1.5px solid #D6D0C6; border-radius: 12px; padding: 0 10px; font: inherit; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="r3" style="font-size: 12px; font-weight: 600; color: #57534E">Mandal name</label>
<select id="r3" style="height: 44px; border: 1.5px solid #D6D0C6; border-radius: 12px; padding: 0 8px; font: inherit; font-size: 14px; background: #FFFFFF; color: #1C1917"><option>All Mandals</option><option>Edison</option><option>Jersey City</option><option>Clifton</option><option>Parsippany</option><option>Passaic</option><option>Pennsylvania</option></select></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="r4" style="font-size: 12px; font-weight: 600; color: #57534E">Mandal type</label>
<select id="r4" style="height: 44px; border: 1.5px solid #D6D0C6; border-radius: 12px; padding: 0 8px; font: inherit; font-size: 14px; background: #FFFFFF; color: #1C1917"><option>All Types</option><option>Kishori</option><option>Yuvti</option><option>Sahid</option><option>Sahradayi</option></select></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="r5" style="font-size: 12px; font-weight: 600; color: #57534E">Volunteer name or username</label>
<input id="r5" type="search" placeholder="Search volunteers" style="height: 44px; border: 1.5px solid #D6D0C6; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="stl" style="font-size: 12px; font-weight: 600; color: #57534E">Session status</span>
<div role="group" aria-labelledby="stl" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #F0ECE5; border-radius: 12px; padding: 4px; gap: 4px">
<sc-for list="{{statuses}}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 38px; border: 0; border-radius: 9px; background: {{s.bg}}; color: #1C1917; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>
</div>
</section>

<section aria-label="Report totals" style="background: #1C1917; color: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 12px; font-weight: 600; color: #D6D3D1">This month · All Mandals · All Types</p>
<div style="display: flex; align-items: baseline; gap: 10px"><p style="margin: 0; font-size: 28px; font-weight: 800">[1,500 h 15 m]</p><p style="margin: 0; font-size: 14px; color: #D6D3D1">[312 sessions]</p></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 46px; border-radius: 12px; border: 0; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"></path></svg>CSV</button>
<button type="button" style="height: 46px; border-radius: 12px; border: 0; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"></path></svg>Excel</button>
</div>
</section>

<section aria-label="Results" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #E7E2DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">{{r.name}}</h2>
<p style="margin: 0; font-size: 12px; color: #57534E">@{{r.user}} · {{r.mandal}} · {{r.type}}</p>
</div>
<span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}">{{r.status}}</span>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; font-weight: 600; color: #57534E">DATE</dt><dd style="margin: 0; font-size: 13px; font-weight: 700">{{r.date}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; font-weight: 600; color: #57534E">IN</dt><dd style="margin: 0; font-size: 13px; font-weight: 700">{{r.cin}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; font-weight: 600; color: #57534E">OUT</dt><dd style="margin: 0; font-size: 13px; font-weight: 700">{{r.cout}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; font-weight: 600; color: #57534E">TOTAL</dt><dd style="margin: 0; font-size: 13px; font-weight: 700">{{r.dur}}</dd></div>
</dl>
</article>
</sc-for>
</section>

<nav aria-label="Pagination" style="display: flex; align-items: center; justify-content: space-between">
<button type="button" disabled style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #E7E2DA; background: #FFFFFF; color: #78716C; font: inherit; font-size: 14px; font-weight: 700">Previous</button>
<p style="margin: 0; font-size: 13px; color: #57534E">1–20 of [312]</p>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #D6D0C6; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Next</button>
</nav>
</main>

<nav aria-label="Admin" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E7E2DA; padding: 8px 4px 20px">
<a href="AdminOverview.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; text-decoration: none; color: #57534E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>Overview</a>
<a href="AdminReports.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 700; text-decoration: none; color: {{accent}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4 2v-8z"></path></svg>Reports</a>
<a href="AdminReview.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; text-decoration: none; color: #57534E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Review</a>
<a href="AdminUsers.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; text-decoration: none; color: #57534E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 20c1-3.5 3.8-5.5 7-5.5s6 2 7 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 20c-.6-2.4-2-4-4-4.8"></path></svg>Volunteers</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4410F","options":["#B4410F","#9F1239","#0F5E5A","#1E3A8A"]},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
renderVals() {
const preset = this.state.preset ?? 'month';
const status = this.state.status ?? 'all';
const done = { status: 'Completed', bg: '#DCFCE7', fg: '#166534' };
return {
accent: this.props.accent ?? '#B4410F',
presets: [['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['date', 'Specific date'], ['custom', 'Custom']].map(([id, label]) => ({
label: label,
on: preset === id ? 'true' : 'false',
bg: preset === id ? '#1C1917' : '#FFFFFF',
fg: preset === id ? '#FFFFFF' : '#1C1917',
border: preset === id ? '#1C1917' : '#D6D0C6',
pick: () => this.setState({ preset: id })
})),
statuses: [['all', 'All'], ['active', 'Active'], ['completed', 'Done'], ['flagged', 'Flagged']].map(([id, label]) => ({
label: label,
on: status === id ? 'true' : 'false',
bg: status === id ? '#FFFFFF' : 'transparent',
pick: () => this.setState({ status: id })
})),
rows: [
{ name: 'Anjali Patel', user: 'anjali.p', mandal: 'Edison', type: 'Yuvti', date: 'Oct 23', cin: '9:12a', cout: '—', dur: '2h 18m', status: 'Active', bg: '#DBEAFE', fg: '#1E40AF' },
{ name: 'Meera Shah', user: 'meeras', mandal: 'Jersey City', type: 'Kishori', date: 'Oct 22', cin: '4:00p', cout: '8:30p', dur: '4h 30m', ...done },
{ name: 'Kavita Desai', user: 'kdesai', mandal: 'Clifton', type: 'Sahradayi', date: 'Oct 22', cin: '10:00a', cout: '1:15p', dur: '3h 15m', ...done },
{ name: 'Riya Mehta', user: 'riya.m', mandal: 'Passaic', type: 'Sahid', date: 'Oct 21', cin: '6:00p', cout: '—', dur: '—', status: 'Flagged', bg: '#FEF3C7', fg: '#92400E' }
]
};
}
}
</script>
</body>
</html>
