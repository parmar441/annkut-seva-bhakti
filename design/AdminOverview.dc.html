<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B4410F}a:hover{color:#8A300A}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1C1917; display: flex; flex-direction: column">
<main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 24px 20px 16px; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 6px; background: #1C1917; color: #FFFFFF">ADMIN</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Overview</h1>
</div>
<p style="margin: 0; font-size: 13px; color: #57534E">Thu, Oct 23</p>
</header>

<section aria-label="Summary" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #E7E2DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 12px; font-weight: 600; color: #57534E">{{c.label}}</p>
<p style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">{{c.value}}</p>
<p style="margin: 0; font-size: 12px; color: #57534E">{{c.sub}}</p>
</div>
</sc-for>
</section>

<a href="AdminReview.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FEF3C7; border-radius: 16px; padding: 14px 16px; text-decoration: none; color: #78350F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 15px">7 sessions need review</strong><span style="font-size: 12px">4 missing clock-outs · 3 overlaps</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>

<section aria-label="Hours by Mandal this month" style="background: #FFFFFF; border: 1px solid #E7E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">Hours by Mandal · October</h2>
<sc-for list="{{mandals}}" as="m" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{m.name}}</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{m.hrs}}</span></div>
<div style="height: 8px; border-radius: 4px; background: #F0ECE5"><div style="height: 8px; border-radius: 4px; width: {{m.w}}; background: {{accent}}"></div></div>
</div>
</sc-for>
</section>

<section aria-label="Hours by Mandal type this month" style="background: #FFFFFF; border: 1px solid #E7E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">Hours by Mandal Type · October</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="4">
<div style="background: #F6F4EF; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 12px; font-weight: 600; color: #57534E">{{t.name}}</p>
<p style="margin: 0; font-size: 18px; font-weight: 800">{{t.hrs}}</p>
</div>
</sc-for>
</div>
</section>
</main>

<nav aria-label="Admin" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E7E2DA; padding: 8px 4px 20px">
<a href="AdminOverview.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 700; text-decoration: none; color: {{accent}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>Overview</a>
<a href="AdminReports.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; text-decoration: none; color: #57534E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4 2v-8z"></path></svg>Reports</a>
<a href="AdminReview.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; text-decoration: none; color: #57534E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Review</a>
<a href="AdminUsers.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; text-decoration: none; color: #57534E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 20c1-3.5 3.8-5.5 7-5.5s6 2 7 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 20c-.6-2.4-2-4-4-4.8"></path></svg>Volunteers</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4410F","options":["#B4410F","#9F1239","#0F5E5A","#1E3A8A"]},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
const m = [['Edison', 412], ['Jersey City', 318], ['Parsippany', 276], ['Clifton', 204], ['Passaic', 161], ['Pennsylvania', 129]];
const max = 412;
return {
accent: this.props.accent ?? '#B4410F',
cards: [
{ label: 'Registered volunteers', value: '[148]', sub: '139 active accounts' },
{ label: 'Completed sessions', value: '[2,316]', sub: 'All time' },
{ label: 'Total seva hours', value: '[7,842 h]', sub: 'All time' },
{ label: 'Hours today', value: '[96.5 h]', sub: '31 volunteers' },
{ label: 'Hours this month', value: '[1,500 h]', sub: 'October' },
{ label: 'On seva now', value: '[18]', sub: 'Active sessions' }
],
mandals: m.map(([name, h]) => ({ name: name, hrs: '[' + h + ' h]', w: Math.round(h / max * 100) + '%' })),
types: [
{ name: 'Kishori', hrs: '[288 h]' },
{ name: 'Yuvti', hrs: '[534 h]' },
{ name: 'Sahid', hrs: '[401 h]' },
{ name: 'Sahradayi', hrs: '[277 h]' }
]
};
}
}
</script>
</body>
</html>
