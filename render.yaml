# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# You'll be asked for MONGO_URL (your Atlas connection string). Everything else is set here.
services:
  - type: web
    name: annkut-seva-bhakti
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # free also works, but sleeps after 15 min idle (≈1 min cold start)
    region: virginia         # close to America/New_York volunteers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false          # secret: entered in the dashboard, never stored in git
      - key: MONGO_DB
        value: annkut_seva
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: APP_TIMEZONE
        value: America/New_York
      - key: WEEK_START
        value: sunday
      # Sized for a 512 MB instance: 1 process, 3 parallel password checks (~64 MB each).
      # On a 2 GB plan (Standard) use WEB_CONCURRENCY=2 and HASH_CONCURRENCY=8.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: HASH_CONCURRENCY
        value: "3"
      - key: MONGO_MAX_POOL_SIZE
        value: "100"
