# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# You'll be asked for MONGO_URL (your Atlas connection string). Everything else is set here.
services:
  - type: web
    name: annkut-seva-bhakti
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free               # no card needed. Sleeps after 15 min idle (first visit then takes ~1 min)
    region: virginia         # close to America/New_York volunteers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false          # secret: entered in the dashboard, never stored in git
      - key: MONGO_DB
        value: annkut_seva
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: APP_TIMEZONE
        value: America/New_York
      - key: WEEK_START
        value: sunday
      # Sized for the free instance (512 MB, 0.1 CPU): 1 process, 2 parallel password checks
      # (~64 MB each). More parallelism wouldn't help on 0.1 CPU and would only use memory.
      # On a paid 2 GB plan (Standard) use WEB_CONCURRENCY=2 and HASH_CONCURRENCY=8.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: HASH_CONCURRENCY
        value: "2"
      - key: MONGO_MAX_POOL_SIZE
        value: "100"
